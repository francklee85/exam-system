[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "exam-system-backend"
version = "0.1.0"
description = "Online exam system backend"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.13,<2.0",
    "asyncmy>=0.2.9,<1.0",
    "fastapi>=0.115,<0.116",
    "pwdlib[argon2]>=0.3,<1.0",
    "pydantic>=2.8,<3.0",
    "pydantic-settings>=2.4,<3.0",
    "pyjwt>=2.10,<3.0",
    "sqlalchemy>=2.0,<3.0",
    "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1.0",
    "pytest>=8.2,<9.0",
    "ruff>=0.5,<1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ANN"]
